name: Test
on: [push, pull_request]
jobs:
  node:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm test
      - run: python3 -m unittest discover -s test -p 'test_*.py'
      - run: bash -n teamcodex.sh install.sh install-team-repos.sh run-team-servers.sh
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Exercise image startup even when the checkout has owner-only permissions.
      - run: chmod -R go-rwx package.json src
      - run: docker build -t teamcodex:local .
      - run: docker run --rm --read-only --user 12345:12345 teamcodex:local help
      - run: docker build -f test/Dockerfile.ubuntu -t teamcodex-test:ubuntu .
      - run: docker run --rm teamcodex-test:ubuntu
