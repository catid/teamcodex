name: Test
on: [push, pull_request]
jobs:
  bun:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run test:oauth
      - run: python3 -m unittest discover -s test -p 'test_*.py'
      - run: bash -n teamcodex.sh install.sh install-team-repos.sh run-team-servers.sh
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Exercise image startup even when the checkout has owner-only permissions.
      - run: chmod -R go-rwx package.json apps packages
      - run: docker build -t teamcodex:local .
      - run: docker run --rm --read-only --user 12345:12345 teamcodex:local help
      - run: docker build -f test/Dockerfile.ubuntu -t teamcodex-test:ubuntu .
      - run: docker run --rm teamcodex-test:ubuntu
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun run test:e2e
  tui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps chromium
      - run: bun run test:tui
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tui-review
          path: artifacts/tui/
